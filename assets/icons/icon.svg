<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5A8F5A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A6B3A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF5EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DDC8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5A2B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC08B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A8F5A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- 杯碟 -->
  <ellipse cx="256" cy="400" rx="140" ry="20" fill="#8B5A2B" opacity="0.3"/>
  <ellipse cx="256" cy="395" rx="120" ry="14" fill="#FAF5EC"/>
  
  <!-- 茶杯主体 -->
  <path d="M 140 280 Q 140 380 256 380 Q 372 380 372 280 L 372 220 L 140 220 Z" 
        fill="url(#cupGrad)" stroke="#D4C5A8" stroke-width="3"/>
  
  <!-- 杯口 -->
  <ellipse cx="256" cy="220" rx="116" ry="20" fill="#E8DDC8" stroke="#D4C5A8" stroke-width="2"/>
  
  <!-- 茶汤 -->
  <ellipse cx="256" cy="225" rx="106" ry="16" fill="url(#teaGrad)"/>
  
  <!-- 杯把 -->
  <path d="M 372 280 Q 420 280 420 320 Q 420 360 372 365" 
        fill="none" stroke="#E8DDC8" stroke-width="18" stroke-linecap="round"/>
  <path d="M 372 280 Q 420 280 420 320 Q 420 360 372 365" 
        fill="none" stroke="#D4C5A8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 蒸汽 -->
  <path d="M 200 170 Q 190 150 200 130 Q 210 110 200 90" 
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="d" 
             values="M 200 170 Q 190 150 200 130 Q 210 110 200 90;
                     M 200 170 Q 210 150 200 130 Q 190 110 200 90;
                     M 200 170 Q 190 150 200 130 Q 210 110 200 90"
             dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 256 160 Q 246 140 256 120 Q 266 100 256 80" 
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <animate attributeName="d" 
             values="M 256 160 Q 246 140 256 120 Q 266 100 256 80;
                     M 256 160 Q 266 140 256 120 Q 246 100 256 80;
                     M 256 160 Q 246 140 256 120 Q 266 100 256 80"
             dur="3.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 312 170 Q 302 150 312 130 Q 322 110 312 90" 
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="d" 
             values="M 312 170 Q 302 150 312 130 Q 322 110 312 90;
                     M 312 170 Q 322 150 312 130 Q 302 100 312 90;
                     M 312 170 Q 302 150 312 130 Q 322 110 312 90"
             dur="2.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- 茶叶装饰（左侧） -->
  <g transform="translate(80, 180) rotate(-30)">
    <path d="M 0 0 Q 20 -15 50 0 Q 20 25 0 20 Q -5 10 0 0 Z" 
          fill="url(#leafGrad)" opacity="0.9"/>
    <line x1="0" y1="10" x2="40" y2="10" stroke="#3A6B3A" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 茶叶装饰（右上） -->
  <g transform="translate(400, 140) rotate(25)">
    <path d="M 0 0 Q 15 -12 40 0 Q 18 20 0 16 Q -4 8 0 0 Z" 
          fill="url(#leafGrad)" opacity="0.8"/>
    <line x1="0" y1="8" x2="32" y2="8" stroke="#3A6B3A" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 茶叶装饰（右中） -->
  <g transform="translate(420, 280) rotate(60)">
    <path d="M 0 0 Q 18 -14 45 0 Q 20 22 0 18 Q -5 9 0 0 Z" 
          fill="url(#leafGrad)" opacity="0.7"/>
    <line x1="0" y1="9" x2="36" y2="9" stroke="#3A6B3A" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
