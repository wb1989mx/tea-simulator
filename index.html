<body>
  <div id="root"></div>
  <script src="tea-data.js"></script>
  <script src="data-layer.js"></script>
  <script type="text/babel" src="components/home.jsx"></script>
  <script type="text/babel" src="components/onboarding.jsx"></script>
  <script type="text/babel" src="components/craft-simulator.jsx"></script>
  <script type="text/babel" src="components/quiz.jsx"></script>
  <script type="text/babel" src="components/library.jsx"></script>
  <script type="text/babel" src="components/achievements.jsx"></script>
  <script type="text/babel" src="components/pwa.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script>
    // Service Worker 注册（在主线程尽早执行）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('[PWA] Service Worker 注册成功:', reg.scope);
            window.__swRegistration = reg;
            // 检查更新
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] 发现新版本，等待激活');
                  window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: { registration: reg } }));
                }
              });
            });
          })
          .catch((err) => {
            console.warn('[PWA] Service Worker 注册失败:', err);
          });
      });
    }
    
    // 监听 PWA 安装事件
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('[PWA] 可以安装应用了');
      window.dispatchEvent(new CustomEvent('pwa-installable'));
    });
    
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] 应用已安装');
      deferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });
    
    // 暴露给 React 组件使用
    window.PWAUtils = {
      getDeferredPrompt: () => deferredPrompt,
      triggerInstall: async () => {
        if (!deferredPrompt) return false;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        return outcome === 'accepted';
      },
      isStandalone: () => {
        return window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true ||
          document.referrer.includes('android-app://');
      }
    };
  </script>
</body>
</html>
